name: Build APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename APK for release
        run: cp app/build/outputs/apk/debug/app-debug.apk solar-system-wallpaper-debug.apk

      - name: Publish debug build to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-build
          name: Debug build (latest)
          body: |
            Auto-built debug APK from `${{ github.sha }}`. Download `solar-system-wallpaper-debug.apk`
            below and open it directly on your phone (Settings > allow install from this source if asked)
            — no need to unzip anything. Requires Android 8.0+.
          prerelease: true
          files: solar-system-wallpaper-debug.apk
